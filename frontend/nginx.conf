# Serve a interface e repassa /api/* para o backend, como o Vite faz em desenvolvimento.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Mesmo limite de upload do backend (MAX_UPLOAD_MB).
  client_max_body_size 50m;

  location /api/ {
    # A barra no fim remove o prefixo: /api/notebooks → /notebooks
    proxy_pass http://backend:3333/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Respostas da IA podem demorar (o backend tenta de novo quando o Gemini está no limite).
    proxy_read_timeout 180s;
  }

  # Recarregar a página em qualquer tela continua abrindo o app.
  location / {
    try_files $uri /index.html;
  }
}
